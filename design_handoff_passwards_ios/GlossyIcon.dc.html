<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ sizePx }};height:{{ sizePx }};border-radius:{{ radiusPx }};display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;{{ gradientStyle }}{{ shadowStyle }}">
  <div style="position:absolute;top:0;left:6%;right:6%;height:46%;border-radius:50%;pointer-events:none;{{ highlightStyle }}"></div>
  <svg width="{{ glyphSize }}" height="{{ glyphSize }}" viewBox="0 0 24 24" fill="none" style="position:relative;z-index:1;">
    <sc-if value="{{ isKey }}" hint-placeholder-val="{{ false }}">
      <circle cx="9" cy="9" r="4.5" stroke="white" stroke-width="2"></circle>
      <line x1="12.6" y1="12.6" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"></line>
      <line x1="15.5" y1="16.5" x2="18" y2="14" stroke="white" stroke-width="2" stroke-linecap="round"></line>
    </sc-if>
    <sc-if value="{{ isPassword }}" hint-placeholder-val="{{ false }}">
      <rect x="5" y="11" width="14" height="10" rx="2.5" stroke="white" stroke-width="2"></rect>
      <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="white" stroke-width="2"></path>
    </sc-if>
    <sc-if value="{{ isNote }}" hint-placeholder-val="{{ false }}">
      <rect x="5" y="3" width="14" height="18" rx="2" stroke="white" stroke-width="2"></rect>
      <line x1="8" y1="9" x2="16" y2="9" stroke="white" stroke-width="1.6" stroke-linecap="round"></line>
      <line x1="8" y1="13" x2="16" y2="13" stroke="white" stroke-width="1.6" stroke-linecap="round"></line>
      <line x1="8" y1="17" x2="13" y2="17" stroke="white" stroke-width="1.6" stroke-linecap="round"></line>
    </sc-if>
    <sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}">
      <rect x="3" y="6" width="18" height="12" rx="2.2" stroke="white" stroke-width="2"></rect>
      <rect x="3" y="10" width="18" height="3" fill="white"></rect>
    </sc-if>
    <sc-if value="{{ isId }}" hint-placeholder-val="{{ false }}">
      <rect x="3" y="5" width="18" height="14" rx="2.2" stroke="white" stroke-width="2"></rect>
      <circle cx="8.5" cy="12" r="2" stroke="white" stroke-width="1.6"></circle>
      <line x1="13" y1="10" x2="19" y2="10" stroke="white" stroke-width="1.6" stroke-linecap="round"></line>
      <line x1="13" y1="14" x2="17.5" y2="14" stroke="white" stroke-width="1.6" stroke-linecap="round"></line>
    </sc-if>
    <sc-if value="{{ isWifi }}" hint-placeholder-val="{{ false }}">
      <path d="M4 9a11 11 0 0 1 16 0" stroke="white" stroke-width="2" stroke-linecap="round"></path>
      <path d="M7.2 12.8a6.5 6.5 0 0 1 9.6 0" stroke="white" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="12" cy="17.5" r="1.6" fill="white"></circle>
    </sc-if>
    <sc-if value="{{ isShield }}" hint-placeholder-val="{{ false }}">
      <path d="M12 3L18.5 5.8V11C18.5 15.8 15.8 19 12 20.6C8.2 19 5.5 15.8 5.5 11V5.8Z" stroke="white" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </sc-if>
    <sc-if value="{{ isBrowser }}" hint-placeholder-val="{{ false }}">
      <circle cx="12" cy="12" r="8" stroke="white" stroke-width="2"></circle>
      <ellipse cx="12" cy="12" rx="3.2" ry="8" stroke="white" stroke-width="2"></ellipse>
      <line x1="4" y1="12" x2="20" y2="12" stroke="white" stroke-width="2"></line>
    </sc-if>
    <sc-if value="{{ isPlus }}" hint-placeholder-val="{{ false }}">
      <line x1="12" y1="5" x2="12" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round"></line>
      <line x1="5" y1="12" x2="19" y2="12" stroke="white" stroke-width="2.2" stroke-linecap="round"></line>
    </sc-if>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 64, &quot;height&quot;: 64},
  &quot;glyph&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;key&quot;,&quot;options&quot;:[&quot;key&quot;,&quot;password&quot;,&quot;note&quot;,&quot;card&quot;,&quot;id&quot;,&quot;wifi&quot;,&quot;shield&quot;,&quot;browser&quot;,&quot;plus&quot;],&quot;tsType&quot;:&quot;string&quot;},
  &quot;bg&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B82F6&quot;,&quot;options&quot;:[&quot;#3B82F6&quot;,&quot;#F59E0B&quot;,&quot;#22C55E&quot;,&quot;#8B5CF6&quot;,&quot;#0EA5E9&quot;,&quot;#EF4444&quot;],&quot;tsType&quot;:&quot;string&quot;},
  &quot;variant&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;premium&quot;,&quot;options&quot;:[&quot;premium&quot;,&quot;friendly&quot;,&quot;playful&quot;],&quot;tsType&quot;:&quot;string&quot;},
  &quot;size&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:44,&quot;min&quot;:24,&quot;max&quot;:96,&quot;step&quot;:2,&quot;tsType&quot;:&quot;number&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size) || 44;
    const bg = this.props.bg || '#3B82F6';
    const variant = ['premium','friendly','playful'].includes(this.props.variant) ? this.props.variant : 'premium';
    const glyph = this.props.glyph || 'key';

    const hexToRgb = (hex) => {
      let h = String(hex).replace('#', '');
      if (h.length === 3) h = h.split('').map(ch => ch + ch).join('');
      const n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    };
    const shade = (hex, p) => {
      const [r, g, b] = hexToRgb(hex);
      const t = p < 0 ? 0 : 255;
      const k = Math.abs(p);
      const mix = (ch) => Math.round((t - ch) * k + ch);
      return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
    };

    const tunes = {
      premium:  { light: 0.30, dark: -0.22, radiusRatio: 0.26, highlight: 0.30, shadow: 0.28 },
      friendly: { light: 0.36, dark: -0.18, radiusRatio: 0.32, highlight: 0.40, shadow: 0.22 },
      playful:  { light: 0.42, dark: -0.20, radiusRatio: 0.36, highlight: 0.50, shadow: 0.30 },
    };
    const tune = tunes[variant];

    const radius = Math.round(size * tune.radiusRatio);
    const gradientStyle = 'background:linear-gradient(155deg, ' + shade(bg, tune.light) + ' 0%, ' + bg + ' 55%, ' + shade(bg, tune.dark) + ' 100%);';
    const highlightStyle = 'background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,' + tune.highlight + ') 0%, rgba(255,255,255,0) 72%);';
    const shadowStyle = 'box-shadow: 0 ' + Math.round(size * 0.09) + 'px ' + Math.round(size * 0.2) + 'px rgba(0,0,0,' + tune.shadow + '), inset 0 -' + Math.round(size * 0.07) + 'px ' + Math.round(size * 0.14) + 'px rgba(0,0,0,0.22), inset 0 1px 1px rgba(255,255,255,0.45);';

    return {
      sizePx: size + 'px',
      radiusPx: radius + 'px',
      gradientStyle,
      highlightStyle,
      shadowStyle,
      glyphSize: Math.round(size * 0.52),
      isKey: glyph === 'key',
      isPassword: glyph === 'password',
      isNote: glyph === 'note',
      isCard: glyph === 'card',
      isId: glyph === 'id',
      isWifi: glyph === 'wifi',
      isShield: glyph === 'shield',
      isBrowser: glyph === 'browser',
      isPlus: glyph === 'plus',
    };
  }
}

</script>
</body>
</html>
